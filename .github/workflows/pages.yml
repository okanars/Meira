# GitHub Pages önizlemesi: main'e her push'ta site/ klasörünü yayınlar.
# Kurulum: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Not: Pages PHP çalıştırmaz; teklif formu "yerel önizleme" başarı ekranı gösterir (e-posta gitmez).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Önizleme için hazırla
        run: |
          # Önizleme arama motorlarına kapalı (asıl site için depodaki robots.txt değişmez)
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          # Pages'te işe yaramayan sunucu dosyaları yayına alınmaz
          rm -f site/.htaccess
          rm -rf site/api

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
